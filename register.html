<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 蒙面畅聊</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1>🎭 蒙面畅聊</h1>
            <p>创建你的匿名身份</p>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="username" name="username" required
                       placeholder="3-20个字符" minlength="3" maxlength="20">
            </div>

            <div class="form-group">
                <label>密码 *</label>
                <input type="password" id="password" name="password" required
                       placeholder="至少6个字符" minlength="6">
            </div>

            <div class="form-group">
                <label>确认密码 *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       placeholder="再次输入密码">
            </div>

            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="nickname" name="nickname"
                       placeholder="展示给别人的昵称">
            </div>

            <div class="form-group">
                <label>性别</label>
                <select id="gender" name="gender">
                    <option value="secret">保密</option>
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
            </div>

            <div class="form-group">
                <label>年龄</label>
                <input type="number" id="age" name="age" min="1" max="120" value="18">
            </div>

            <div class="form-group">
                <label>个人简介</label>
                <textarea id="bio" name="bio" rows="3"
                          placeholder="介绍一下自己..."></textarea>
            </div>

            <div class="form-group">
                <label>选择头像风格</label>
                <div class="avatar-selection">
                    <div class="avatar-option" data-type="emoji">
                        <div class="avatar-preview emoji">😀</div>
                        <span>表情系</span>
                    </div>
                    <div class="avatar-option" data-type="animal">
                        <div class="avatar-preview animal">🦊</div>
                        <span>动物系</span>
                    </div>
                    <div class="avatar-option" data-type="cartoon">
                        <div class="avatar-preview cartoon">🎨</div>
                        <span>卡通系</span>
                    </div>
                    <div class="avatar-option" data-type="abstract">
                        <div class="avatar-preview abstract">🔮</div>
                        <span>抽象系</span>
                    </div>
                </div>
                <input type="hidden" id="avatarType" name="avatarType" value="emoji">
            </div>

            <div class="form-agreement">
                <label class="checkbox">
                    <input type="checkbox" required>
                    <span>我已阅读并同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a></span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full">立即注册</button>

            <div class="auth-footer">
                已有账号？ <a href="{{ url_for('login') }}">立即登录</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('两次密码输入不一致');
                return;
            }

            const data = {
                username: document.getElementById('username').value,
                password: password,
                nickname: document.getElementById('nickname').value,
                gender: document.getElementById('gender').value,
                age: parseInt(document.getElementById('age').value),
                bio: document.getElementById('bio').value,
                avatar_type: document.getElementById('avatarType').value
            };

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    window.location.href = result.redirect;
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('注册失败，请稍后重试');
            }
        });

        // 头像选择
        document.querySelectorAll('.avatar-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('active'));
                option.classList.add('active');
                document.getElementById('avatarType').value = option.dataset.type;
            });
        });

        // 默认选中第一个
        document.querySelector('.avatar-option[data-type="emoji"]').classList.add('active');
    </script>
</body>
</html>
